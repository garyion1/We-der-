plugins {
    // Loom 1.14 is what Fabric's 1.21.11 announcement specifies.
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Litematica is deliberately NOT a dependency: this mod parses .litematic
    // files itself (see schematic/RawLitematicReader.java) rather than binding
    // to Litematica's internal API, which is not published for third-party use
    // and shifts between versions. Install Litematica alongside this mod if you
    // want its ghost-preview to position builds -- it just isn't needed to compile.
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
