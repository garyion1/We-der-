pluginManagement {
    repositories {
        // "url =" (assignment) rather than "url" (method call): the latter is
        // deprecated in Gradle 8 and removed in Gradle 9. This form works on both.
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
    }
}

rootProject.name = "auto-litematica-builder"
