# Versions verified against Fabric's 1.21.11 release announcement (2025-12-05)
# and Modrinth's Fabric API listing, rather than guessed.
minecraft_version=1.21.11

# Loom does NOT accept Gradle dynamic versions ("1.21.11+build.+") for mappings
# -- it fails with "Could not resolve mappings". Pin the exact build.
# Confirmed present via meta.fabricmc.net/v2/versions/yarn/1.21.11.
# Note: 1.21.11 is the LAST version Fabric publishes Yarn for; they're moving to
# Mojang mappings after this. This mod's code is written in Yarn names.
yarn_mappings=1.21.11+build.3

# Confirmed via meta.fabricmc.net/v2/versions/loader/1.21.11
loader_version=0.19.3
fabric_api_version=0.141.1+1.21.11

# Mod metadata
mod_version=0.1.0
maven_group=dev.autobuilder
archives_base_name=auto-litematica-builder

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
