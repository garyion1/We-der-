# Versions verified against Fabric's 1.21.11 release announcement (2025-12-05)
# and Modrinth's Fabric API listing, rather than guessed.
minecraft_version=1.21.11

# Yarn is resolved dynamically ("build.+") so Gradle picks whatever the latest
# published build for 1.21.11 is -- avoids pinning a build number that may not
# exist. Note: 1.21.11 is the LAST Minecraft version Fabric publishes Yarn for;
# they're moving to Mojang mappings after this. This mod's code is written in
# Yarn names, so it stays on Yarn.
yarn_mappings=1.21.11+build.+

loader_version=0.18.1
fabric_api_version=0.141.1+1.21.11

# Mod metadata
mod_version=0.1.0
maven_group=dev.autobuilder
archives_base_name=auto-litematica-builder

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
