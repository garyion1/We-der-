name: Build Minecraft mod

# Builds the Fabric mod in mod/ on GitHub's runners, which (unlike the
# sandbox this was written in) can reach Mojang's and Fabric's Maven repos.
# The finished jar is attached to the run as a downloadable artifact.

on:
  push:
    paths:
      - 'mod/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          # Without --stacktrace: Gradle's stack traces run to hundreds of lines
          # and push the actual "What went wrong" message out of the log tail.
          # On failure, re-print just the diagnostic section so it's readable.
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log || {
            echo "=================== COMPILE ERRORS ======================="
            # javac errors print as task output, well above the "What went
            # wrong" summary, so pull them out explicitly.
            grep -E "^(/|.*\.java:[0-9]+: )(error|warning)" build.log | head -80 \
              || echo "(no javac errors -- failure was not compilation)"
            echo "=================== FAILURE SUMMARY ======================"
            grep -A12 "What went wrong" build.log || tail -30 build.log
            echo "=========================================================="
            exit 1
          }

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auto-litematica-builder-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error
