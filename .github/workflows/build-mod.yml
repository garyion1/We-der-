name: Build Minecraft mod

# Builds the Fabric mod in mod/ on GitHub's runners, which (unlike the
# sandbox this was written in) can reach Mojang's and Fabric's Maven repos.
# The finished jar is attached to the run as a downloadable artifact.

on:
  push:
    paths:
      - 'mod/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The environment this mod was authored in cannot reach Fabric's servers,
      # so version numbers had to be inferred. This step asks the runner (which
      # can reach them) what actually exists, so failures name real versions.
      - name: Probe Fabric metadata
        run: |
          echo "=== yarn builds for 1.21.11 ==="
          curl -s "https://meta.fabricmc.net/v2/versions/yarn/1.21.11" | head -c 1500 || echo "(request failed)"
          echo
          echo "=== loader for 1.21.11 (first entry) ==="
          curl -s "https://meta.fabricmc.net/v2/versions/loader/1.21.11" | head -c 400 || echo "(request failed)"
          echo
          echo "=== latest game versions ==="
          curl -s "https://meta.fabricmc.net/v2/versions/game" | head -c 300 || echo "(request failed)"
          echo

      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          # Without --stacktrace: Gradle's stack traces run to hundreds of lines
          # and push the actual "What went wrong" message out of the log tail.
          # On failure, re-print just the diagnostic section so it's readable.
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log || {
            echo "===================== FAILURE DETAIL ====================="
            grep -B2 -A40 "What went wrong" build.log || tail -60 build.log
            echo "=========================================================="
            exit 1
          }

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auto-litematica-builder-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error
